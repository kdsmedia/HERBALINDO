plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.altomedia.herbalindo'
    compileSdk 36

    defaultConfig {
        applicationId "com.altomedia.herbalindo"
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
        vectorDrawables.useSupportLibrary true
        resourceConfigurations += ["in", "id", "en"]
    }

    signingConfigs {
        release {
            storeFile rootProject.file("keystore/ALTOMEDIA.jks")
            storePassword "Kdsmedia@123"
            keyAlias "kdsmedia"
            keyPassword "Kdsmedia@123"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'DebugProbesKt.bin', 'kotlin/**']
        }
    }

    bundle {
        language { enableSplit = true }
        density { enableSplit = true }
        abi { enableSplit = true }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'

    // AdMob (banner + rewarded)
    implementation 'com.google.android.gms:play-services-ads:23.6.0'

    // QRIS generator (ZXing core, offline)
    implementation 'com.google.zxing:core:3.5.3'

    testImplementation 'junit:junit:4.13.2'
    // Implementasi JSON nyata untuk pengujian JVM (stub android.jar tidak berisi method).
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}