plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.altomedia.herbalindo'
    compileSdk 36

    defaultConfig {
        applicationId "com.altomedia.herbalindo"
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
        vectorDrawables.useSupportLibrary true
        resourceConfigurations += ["in", "id", "en"]
    }

    signingConfigs {
        release {
            // Kredensial dibaca dari keystore/keystore.properties (tidak
            // disimpan di git) agar build rilis tetap dapat direproduksi.
            def props = new Properties()
            def propFile = rootProject.file("keystore/keystore.properties")
            if (!propFile.exists()) {
                throw new GradleException("Berkas keystore/keystore.properties tidak ditemukan")
            }
            propFile.withInputStream { props.load(it) }
            def storePath = props.getProperty("signing.storeFile", "keystore/ALTOMEDIA.jks")
            def storePass = props.getProperty("signing.storePassword")
            def alias = props.getProperty("signing.keyAlias")
            def keyPass = props.getProperty("signing.keyPassword")
            if (!storePass || !alias || !keyPass) {
                throw new GradleException("keystore.properties harus memuat signing.storePassword, signing.keyAlias, dan signing.keyPassword")
            }
            storeFile rootProject.file(storePath)
            storePassword storePass
            keyAlias alias
            keyPassword keyPass
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'DebugProbesKt.bin', 'kotlin/**']
        }
    }

    bundle {
        language { enableSplit = true }
        density { enableSplit = true }
        abi { enableSplit = true }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'

    // AdMob (banner + rewarded)
    implementation 'com.google.android.gms:play-services-ads:23.6.0'

    // QRIS generator (ZXing core, offline)
    implementation 'com.google.zxing:core:3.5.3'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.6.1'
    // Implementasi JSON nyata untuk pengujian JVM (stub android.jar tidak berisi method).
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}